name: 功能建议
description: 提出改进或新能力
title: "[feat] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: area
    attributes:
      label: 主要涉及
      options:
        - qixue-api
        - qixue-admin
        - qixue-web
        - 文档 / 工程化
        - 跨端
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 可选；若有接口或交互草图请简述
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案
      description: 可选
