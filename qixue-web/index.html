<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4286F5" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="启学" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <title></title>
    <script>
      (function () {
        try {
          var m = window.matchMedia
          var on = (navigator.standalone === true) || (m && (
            m('(display-mode: standalone)').matches
            || m('(display-mode: fullscreen)').matches
            || m('(display-mode: minimal-ui)').matches
            || m('(display-mode: window-controls-overlay)').matches
          ))
          if (on) document.documentElement.classList.add('qx-pwa-standalone')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
