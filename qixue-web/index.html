<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- 浏览器标签可用品牌色；独立窗口 / 全屏启动时状态栏透明，避免启动 LOGO 上方出现色条 -->
    <meta name="theme-color" content="#4286F5" media="(display-mode: browser)" />
    <meta name="theme-color" content="transparent" media="(display-mode: standalone)" />
    <meta name="theme-color" content="transparent" media="(display-mode: fullscreen)" />
    <meta name="theme-color" content="transparent" media="(display-mode: minimal-ui)" />
    <meta name="theme-color" content="transparent" media="(display-mode: window-controls-overlay)" />
    <meta name="theme-color" content="transparent" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="启学" />
    <meta name="format-detection" content="telephone=no, email=no, address=no" />
    <link rel="icon" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/pwa/apple-touch-icon.png" />
    <title></title>
    <script>
      (function () {
        try {
          var m = window.matchMedia
          var on = (navigator.standalone === true) || (m && (
            m('(display-mode: standalone)').matches
            || m('(display-mode: fullscreen)').matches
            || m('(display-mode: minimal-ui)').matches
            || m('(display-mode: window-controls-overlay)').matches
          ))
          if (on) {
            document.documentElement.classList.add('qx-pwa-standalone')
            var metas = document.querySelectorAll('meta[name="theme-color"]')
            for (var i = 0; i < metas.length; i++) metas[i].setAttribute('content', 'transparent')
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /* 独立窗口首屏：透明底，避免启动闪蓝条 / 不透明状态栏底 */
      html.qx-pwa-standalone,
      html.qx-pwa-standalone body {
        background: transparent;
      }
      html.qx-pwa-standalone body {
        background: #f8f8f8;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
